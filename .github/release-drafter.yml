# Configuration for Release Drafter: https://github.com/toolmantim/release-drafter
name-template: 'v$RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'

# Emoji reference: https://gitmoji.carloscuesta.me/
categories:
  - title: 💥 Breaking changes
    when:
      labels:
        - breaking
  - title: 🚨 Removed
    when:
      labels:
        - removed
  - title: ⚠️ Deprecated
    when:
      labels:
        - deprecated
  - title: 🚀 New features and improvements
    when:
      labels:
        - enhancement
        - feature
  - title: 🐛 Bug fixes
    when:
      labels:
        - bug
        - fix
        - bugfix
        - regression
  - title: 🌐 Localization and translation
    when:
      labels:
        - localization
  - title: 👷 Changes for developers
    when:
      labels:
        - developer
  - title: 📝 Documentation updates
    when:
      labels:
        - documentation
  # Default label used by Dependabot. Listed before "Maintenance" and
  # exclusive, so Dependabot PRs (which also get the `chore` label) are
  # listed here only.
  - title: 📦 Dependency updates
    exclusive: true
    when:
      labels:
        - dependencies
    collapse-after: 15
  - title: 👻 Maintenance
    when:
      labels:
        - chore
        - internal
        - maintenance
  - title: 🚦 Tests
    when:
      labels:
        - test
        - tests
  - title: ✍ Other changes
  # Dropped from the release notes before anything else runs
  - type: pre-exclude
    when:
      labels:
        - no-changelog
        - skip-changelog
        - invalid
  # https://github.com/release-drafter/release-drafter?tab=readme-ov-file#version-resolver
  - type: version-resolver
    semver-increment: major
    when:
      label: major
  - type: version-resolver
    semver-increment: minor
    when:
      label: minor
  - type: version-resolver
    semver-increment: patch
    when:
      label: patch
  # Fallback when no version label is present
  - type: version-resolver
    semver-increment: patch

change-template: '- $TITLE by @$AUTHOR in #$NUMBER'
template: |
  <!-- Optional: add a release summary here -->
  $CHANGES

  **Full Changelog**: https://github.com/$OWNER/$REPOSITORY/compare/$PREVIOUS_TAG...v$RESOLVED_VERSION

autolabeler:
  - label: 'documentation'
    files:
      - '*.md'
      - '*.rst'
    branch:
      - '/docs{0,1}\/.+/'
  - label: 'bug'
    branch:
      - '/fix\/.+/'
    title:
      - '/fix/i'
  - label: 'enhancement'
    branch:
      - '/feature\/.+/'

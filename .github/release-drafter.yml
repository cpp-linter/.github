# Configuration for Release Drafter: https://github.com/toolmantim/release-drafter
name-template: 'v$RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'

# Emoji reference: https://gitmoji.carloscuesta.me/
categories:
  - title: 💥 Breaking changes
    when:
      labels:
        - breaking
  - title: 🚨 Removed
    when:
      labels:
        - removed
  - title: ⚠️ Deprecated
    when:
      labels:
        - deprecated
  - title: 🚀 New features and improvements
    when:
      labels:
        - enhancement
        - feature
  - title: 🐛 Bug fixes
    when:
      labels:
        - bug
        - fix
        - bugfix
        - regression
  - title: 🌐 Localization and translation
    when:
      labels:
        - localization
  - title: 👷 Changes for developers
    when:
      labels:
        - developer
  - title: 📝 Documentation updates
    when:
      labels:
        - documentation
  - title: 👻 Maintenance
    when:
      labels:
        - chore
        - internal
        - maintenance
  - title: 🚦 Tests
    when:
      labels:
        - test
        - tests
  - title: ✍ Other changes
  # Default label used by Dependabot
  - title: 📦 Dependency updates
    when:
      labels:
        - dependencies
    collapse-after: 15
  # Dropped from the release notes before anything else runs
  - type: pre-exclude
    when:
      labels:
        - no-changelog
        - skip-changelog
        - invalid
  # https://github.com/release-drafter/release-drafter?tab=readme-ov-file#version-resolver
  # The next version comes from the conventional PR title: `type!:` is a
  # breaking change (major), `feat:` is minor, anything else is patch.
  # A `semver:*` label overrides the title in either direction: these rules
  # come first and are exclusive, so the title rules below are skipped for a
  # labeled PR. The labels are deliberately not named `major`/`minor`/`patch`,
  # because Dependabot adds labels with those exact names to its PRs whenever
  # they exist in the repository.
  - type: version-resolver
    semver-increment: major
    exclusive: true
    when:
      label: semver:major
  - type: version-resolver
    semver-increment: minor
    exclusive: true
    when:
      label: semver:minor
  - type: version-resolver
    semver-increment: patch
    exclusive: true
    when:
      label: semver:patch
  - type: version-resolver
    semver-increment: major
    when:
      conventional:
        breaking: true
  - type: version-resolver
    semver-increment: minor
    when:
      conventional:
        type: feat
  # Fallback when nothing above matches
  - type: version-resolver
    semver-increment: patch

change-template: '- $TITLE by @$AUTHOR in #$NUMBER'
template: |
  <!-- Optional: add a release summary here -->
  $CHANGES

  **Full Changelog**: https://github.com/$OWNER/$REPOSITORY/compare/$PREVIOUS_TAG...v$RESOLVED_VERSION

autolabeler:
  - label: 'documentation'
    files:
      - '*.md'
      - '*.rst'
    branch:
      - '/docs{0,1}\/.+/'
  - label: 'bug'
    branch:
      - '/fix\/.+/'
    title:
      - '/fix/i'
  - label: 'enhancement'
    branch:
      - '/feature\/.+/'

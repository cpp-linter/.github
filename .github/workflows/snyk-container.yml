name: Snyk Container

on:
  workflow_call:
    inputs:
      image:
        description: 'Docker image to scan'
        default: xianpengshen/clang-tools:all
        required: false
        type: string

jobs:
  snyk:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Run Snyk to check Docker image for vulnerabilities
      continue-on-error: true
      uses: snyk/actions/docker@9adf32b1121593767fc3c057af55b55db032dc04 # v1.0.0
      env:
        # In order to use the Snyk Action you will need to have a Snyk API token.
        # More details in https://github.com/snyk/actions#getting-your-snyk-token
        # or you can sign up for free at https://snyk.io/login
        SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }} # zizmor: ignore[secrets-outside-env]
      with:
        image: ${{ inputs.image }}
        args: --severity-threshold=high --file=Dockerfile.all

    - name: Upload result to GitHub Code Scanning
      if: hashFiles('snyk.sarif') != ''
      uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
      with:
        sarif_file: snyk.sarif
